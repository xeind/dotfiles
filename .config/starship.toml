# Prompt for nushell, laid out like the p10k "lean" prompt zsh uses
# (.p10k.zsh): one line, dir + git on the left, status, duration and
# time on the right. Colors are the same 256-color numbers p10k sets.

add_newline = false
format = "${env_var.PROMPT_DIR}($git_branch$git_status )$character"
right_format = "$status$cmd_duration$jobs$time"

# Path colored in config.nu (p10k anchors), passed as PROMPT_DIR.
[env_var.PROMPT_DIR]
format = "$env_value "

[git_branch]
style = "76"
format = "[$branch]($style)"

[git_status]
# Colors per symbol, as p10k: green 76, yellow 178, blue 39, red 196.
format = "($ahead_behind$stashed$conflicted$staged$modified$untracked)"
ahead = "[ ⇡${count}](76)"
behind = "[ ⇣${count}](76)"
diverged = "[ ⇣${behind_count}⇡${ahead_count}](76)"
stashed = "[ *${count}](76)"
conflicted = "[ ~${count}](196)"
staged = "[ +${count}](178)"
modified = "[ !${count}](178)"
untracked = "[ ?${count}](39)"

[character]
success_symbol = "[❯](15)"
error_symbol = "[❯](196)"

[status]
disabled = false
style = "160"
symbol = "✘"
format = "[$symbol$status]($style) "

[cmd_duration]
min_time = 3_000
style = "101"
format = "[$duration]($style) "

[jobs]
style = "70"

[time]
disabled = false
style = "250"
time_format = "%H:%M:%S"
format = "[$time]($style)"
