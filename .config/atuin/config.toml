# atuin: shell history for zsh and nushell (Ctrl+R).
# History stays local; sync runs only after `atuin register`/`login`.

# Enter runs the picked command; Tab puts it on the line to edit.
enter_accept = true

# Esc/Ctrl+C gives back the typed line instead of an empty one.
exit_mode = "return-query"

# mise installs and updates atuin (update_tools).
update_check = false

# Key widgets run as host commands in nushell; keep them out of history.
history_filter = [
  "^sudo-escape$",
  "^fzf-file$",
  "^fzf-cd$",
]
