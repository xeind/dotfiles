const contextSession = HyperdashModel.createSession(HyperdashModel.createContextStore);
const context = contextSession.store;
let insightsData = null;
let health = null;
let dataError = null;
let layers = [];
let icons = { apps: {}, sites: {} };
const iconCache = new Map();
let iconVersion = 0;
let listScope = null;
let listSignature = null;
let listSelected = null;
let headerMode = null;
let bindings = [];
let months = [];
let tabStops = false; // sequential focus is off after each open until Tab is pressed
let theme = "manila";
let lastActivity = null;
let lastSegments = null;
let groupCaptionOverride = null;
let renderNow = null; // the "now" a protocol call supplied; interactions use the real clock
let view = null;
const keyNodes = new Map();

const $ = (id) => document.getElementById(id);

function post(message) {
  window.webkit?.messageHandlers?.dashboard?.postMessage(message);
}

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function symbol(key) {
  return KEY_SYMBOLS[key] || key.toUpperCase();
}

function chip(key) {
  return element("span", "chip", symbol(key));
}

function plural(n, word) {
  return `${n.toLocaleString("en-US")} ${word}${n === 1 ? "" : "es"}`;
}

function monthLabel(month) {
  const [year, index] = month.split("-").map(Number);
  const name = MONTH_NAMES[index - 1];
  return year === new Date().getFullYear() ? name : `${name.slice(0, 3)} ${year}`;
}

function timeAgo(timestamp) {
  const minutes = Math.floor((Date.now() - new Date(timestamp).getTime()) / 60000);
  if (minutes < 1) return "just now";
  if (minutes < 60) return `${minutes}m ago`;
  if (minutes < 60 * 24) return `${Math.floor(minutes / 60)}h ago`;
  return `${Math.floor(minutes / (60 * 24))}d ago`;
}

// The keyboard is built once; render() only changes classes.
function buildKeyboard() {
  for (const [index, row] of KEY_ROWS.entries()) {
    const rowNode = element("div", `row row-${index}`);
    for (const key of row) {
      const node = element("button", key === "spacebar" ? "key space" : "key", key === "spacebar" ? "space" : symbol(key));
      node.tabIndex = -1; // typing selects keys; Tab stays short
      node.addEventListener("click", () => pressKey(key));
      keyNodes.set(key, node);
      rowNode.append(node);
    }
    $("keyboard").append(rowNode);
  }

  const legend = element("div", "heat-legend");
  legend.append(element("span", "", "LESS"));
  for (let step = 0; step < HEAT_STEPS; step++) legend.append(element("i", `h${step}`));
  legend.append(element("span", "", "MORE"));
  $("keyboard").append(legend);
}

const currentNow = () => renderNow || HyperdashModel.localStamp(new Date());

function buildView() {
  const M = HyperdashModel;
  const month = state.monthId;
  const counts = store.countsOf(month);
  const rows = M.buildRows(bindings, counts, state.layer);
  const total = M.sumCounts(counts, state.layer);
  const previousTotal = M.sumCounts(store.countsOf(M.previousMonth(month)), state.layer);

  // Heat per keyboard key: layer totals on the overview, key counts in a layer.
  const heat = new Map();
  for (const row of rows) {
    const key = state.layer === null ? row.layer : row.key;
    heat.set(key, (heat.get(key) || 0) + row.count);
  }

  return {
    month,
    total,
    comparison: M.compareMonths({ month, total, previousTotal, firstEvent: store.summary().firstEvent, now: currentNow() }),
    scoped: rows,
    used: rows.filter((row) => row.count > 0),
    heat,
  };
}

// `announce` posts the new height to the host. Protocol calls return the height instead.
function render(announce = true) {
  const M = HyperdashModel;
  view = buildView();
  const inLayer = state.layer !== null;
  const page = state.page;
  const broken = dataError !== null;
  const am = !broken && page === "activity" ? activityModel() : null;
  const activity = am ? am.a : null;
  const refocus = keyboardFocused(document.activeElement) ? rebuiltControl(document.activeElement) : null;

  // Swap the header icon only when the mode changes, so a focused Back button keeps focus.
  const mode = inLayer || page ? "back" : "home";
  if (mode !== headerMode) {
    headerMode = mode;
    if (mode === "back") {
      $("header-icon").outerHTML = `<button class="header-icon tabstop" id="header-icon" aria-label="Back">${ICON_BACK}</button>`;
      $("header-icon").addEventListener("click", closeLayer);
      applyTabStops();
    } else {
      $("header-icon").outerHTML = `<span class="header-icon" id="header-icon">${ICON_KEYBOARD}</span>`;
    }
  }
  $("title").textContent = page ? PAGE_TITLES[page] : inLayer ? LAYER_NAMES[state.layer] || state.layer : "hyperdash";

  // Insights describe one analysis run: show its month and age instead of the month picker.
  const insightsPage = page === "insights";
  $("month-pill").hidden = insightsPage;
  $("updated").hidden = !insightsPage || !insightsData?.generated;
  if (!$("updated").hidden) {
    const month = insightsData.month ? `${monthLabel(insightsData.month).slice(0, 3).toUpperCase()} · ` : "";
    $("updated-label").textContent = `${month}UPDATED ${timeAgo(insightsData.generated).toUpperCase()}`;
  }
  $("totals").hidden = insightsPage || broken;
  $("keyboard").hidden = page !== null || broken;

  // The pill walks days in the Activity day view and months everywhere else.
  const dayMode = am?.mode === "day";
  if (dayMode) {
    $("month-label").textContent = HyperdashModel.dayLabel(state.day, today()).toUpperCase();
    $("previous-month").disabled = state.day <= firstDay();
    $("next-month").disabled = state.day >= today();
  } else {
    $("month-label").textContent = monthLabel(view.month).toUpperCase();
    $("previous-month").disabled = months.indexOf(state.monthId) === 0;
    $("next-month").disabled = months.indexOf(state.monthId) === months.length - 1;
  }

  const shownTotal = activity ? activity.total : view.total;
  $("total").textContent = shownTotal.toLocaleString("en-US");
  $("total-unit").textContent = (shownTotal === 1 ? "PRESS" : "PRESSES")
    + (inLayer ? ` · ${view.used.length} OF ${view.scoped.length} USED` : "");

  // The percentage shows only when both months are complete (see compareMonths).
  const delta = $("delta");
  if (activity) {
    delta.hidden = activity.total === 0;
    const hour = String(activity.peakHour).padStart(2, "0");
    delta.textContent = `PEAK ${hour}:00–${String(activity.peakHour + 1).padStart(2, "0")}:00`;
    delta.className = "delta peak";
  } else {
    const { comparable, percent } = view.comparison;
    delta.hidden = !comparable;
    if (comparable) {
      delta.textContent = `${percent >= 0 ? "+" : "−"}${Math.abs(percent)}%`;
      delta.className = `delta ${percent >= 0 ? "up" : "down"}`;
    }
  }

  // Square root spreads the low counts; bins 1-4 split the used range, 0 is bound but unused.
  const max = Math.max(1, ...view.heat.values());
  const rowByKey = inLayer ? new Map(view.scoped.map((row) => [row.key, row])) : null;
  for (const [key, node] of keyNodes) {
    const count = view.heat.get(key);
    const selected = inLayer && key === state.selected;
    const step = count === undefined ? "" : count === 0 ? " h0" : ` h${1 + Math.min(3, Math.floor(Math.sqrt(count / max) * 4))}`;
    node.className = `key${key === "spacebar" ? " space" : ""}${step}${selected ? " selected" : ""}`;
    node.disabled = count === undefined;
    node.setAttribute("aria-pressed", String(selected));
    node.setAttribute("aria-label", count === undefined
      ? `${key === "spacebar" ? "Space" : key.toUpperCase()}, not bound`
      : `${inLayer ? rowByKey.get(key).label : `${LAYER_NAMES[key] || key} layer`}, ${plural(count, "press")}`);
  }

  const listed = page === null && !broken;
  $("list").hidden = !listed;
  renderGroupbar(listed);
  $("problem").hidden = !broken;
  $("problem").textContent = broken ? `Cannot show the dashboard. ${dataError}` : "";
  $("detail").hidden = !inLayer || broken;
  $("insights").hidden = page !== "insights" || broken;
  $("activity").hidden = page !== "activity" || broken;
  if (broken) {
    // Nothing else to draw.
  } else if (inLayer) {
    renderDetail();
  }
  if (listed) renderList(inLayer);
  else if (!broken && page === "insights") renderInsights();
  else if (!broken) renderActivity(am);
  renderStatus(broken);
  if (refocus && document.activeElement === document.body) document.querySelector(refocus)?.focus({ preventScroll: true });
  renderFooter();

  refreshFades();
  if (announce) post({ action: "resize", height: document.body.scrollHeight });
}

// The status line and the "i" panel: what the counts mean and how fresh the data is.
function renderStatus(broken) {
  const M = HyperdashModel;
  const now = currentNow();
  const summary = store.summary();
  const status = $("status");
  status.hidden = broken;
  const line = M.describeHealth({ health, lastEvent: summary.lastEvent, rejected: summary.rejected, now });
  status.textContent = line.text;
  status.dataset.level = line.level;

  $("about").hidden = !state.aboutOpen || broken;
  $("about-toggle").setAttribute("aria-expanded", String(state.aboutOpen));
  if (state.aboutOpen) {
    const themeButton = element("button", "themebtn", `THEME · ${theme.toUpperCase()}`);
    themeButton.id = "theme-button";
    themeButton.setAttribute("aria-label", "Switch theme (T on the overview)");
    $("about").replaceChildren(...M.aboutLines({ health, insights: insightsData, summary, now, statusText: line.full }).map((text) => element("p", "", text)), themeButton);
  }
}

// Share of presses per colour group, above the list. Clicking a segment filters the list to that group.
function renderGroupbar(visible) {
  const wrap = $("groupwrap");
  const totals = {};
  let sum = 0;
  if (visible) {
    for (const row of view.scoped) {
      if (row.count === 0) continue;
      const group = groupOf(row.layer, row.category);
      totals[group] = (totals[group] || 0) + row.count;
      sum += row.count;
    }
  }
  wrap.hidden = !visible;
  if (wrap.hidden) return;
  const signature = `${state.group}|${groupCaptionOverride}|${GROUPS.map((g) => totals[g] || 0).join(",")}`;
  if (signature === groupSignature) return;
  groupSignature = signature;
  if (sum === 0) {
    $("groupbar").replaceChildren();
    $("groupcap").textContent = "BY GROUP · NO PRESSES YET";
    return;
  }
  const share = (n) => `${Math.round((n / sum) * 100)}%`;
  $("groupbar").replaceChildren(...GROUPS.filter((g) => totals[g]).map((group) => {
    const segment = element("button", `grp-${group}`);
    segment.style.flex = String(totals[group]);
    segment.dataset.group = group;
    segment.setAttribute("aria-pressed", String(state.group === group));
    segment.setAttribute("aria-label", `${GROUP_LABELS[group]} ${totals[group]} presses, filter the list`);
    segment.dataset.caption = `${GROUP_LABELS[group].toUpperCase()} · ${totals[group].toLocaleString("en-US")} · ${share(totals[group])}`;
    segment.tabIndex = -1;
    if (state.group !== null && state.group !== group) segment.classList.add("dimmed");
    return segment;
  }));
  const top = GROUPS.filter((g) => totals[g]).sort((a, b) => totals[b] - totals[a]).slice(0, 3);
  $("groupcap").textContent = groupCaptionOverride ? groupCaptionOverride : state.group
    ? `${GROUP_LABELS[state.group].toUpperCase()} ONLY · CLICK AGAIN TO CLEAR`
    : `BY GROUP · ${top.map((g) => `${GROUP_LABELS[g].toUpperCase()} ${share(totals[g])}`).join(" · ")}`;
}

function emptyMessage() {
  if (health?.log && health.log.status !== "ok") return `Usage log ${health.log.status} — nothing to show`;
  if (store.summary().count === 0) return "No presses recorded yet";
  if (state.page === "activity" && state.activityMode === "day") return `No presses on ${HyperdashModel.dayLabel(state.day, today()).toLowerCase()}`;
  return `Nothing logged in ${monthLabel(view.month)} yet`;
}

function monogram(text) {
  return element("span", "icon mono", text.replace(/^www\./, "").charAt(0).toUpperCase());
}

// Icon nodes are built once per binding and cloned per row, so decoded images are reused.
function iconFor(b) {
  const id = `${b.layer} ${b.key}`;
  let template = iconCache.get(id);
  if (!template) {
    const app = b.app && icons.apps[b.app];
    const site = b.site && icons.sites[b.site];
    if (app) {
      template = element("span", "icon");
      const image = element("img");
      image.src = app;
      template.append(image);
    } else if (site?.svg) {
      template = element("span", "icon site");
      template.style.color = site.color || "var(--soft)";
      template.innerHTML = site.svg;
    } else if (b.historical) {
      template = element("span", "icon");
      template.innerHTML = lineIcon('<circle cx="12" cy="12" r="8" stroke-dasharray="3 3.2"/>');
    } else if (b.app || b.site) {
      template = monogram(b.app || b.site);
    } else {
      template = element("span", "icon");
      template.innerHTML = CATEGORY_GLYPHS[b.category] || LAYER_GLYPHS[b.layer] || lineIcon('<circle cx="12" cy="12" r="3"/>');
    }
    iconCache.set(id, template);
  }
  return template.cloneNode(true);
}

// One compact row per binding. The overview ranks used combos; a layer page lists every binding.
// Logged combos with no current binding show as historical rows, so totals and rankings agree.
function renderList(inLayer) {
  const list = $("list");
  const scope = `${state.layer}|${view.month}`;
  const rows = (inLayer ? view.scoped : view.used).filter((row) => state.group === null || groupOf(row.layer, row.category) === state.group);

  // Skip the rebuild when nothing a row shows has changed, so hover, scroll and focus stay put.
  const signature = `${scope}|${inLayer}|${state.selected}|${state.group}|${iconVersion}|`
    + (rows.length === 0 ? emptyMessage() : rows.map((r) => `${r.layer} ${r.key} ${r.count} ${r.label}`).join("\n"));
  if (signature === listSignature) return;
  listSignature = signature;

  const scrollTop = scope === listScope ? list.scrollTop : 0;
  listScope = scope;
  const active = document.activeElement;
  const focusedId = active?.classList?.contains("item") ? `${active.dataset.layer} ${active.dataset.key}` : null;

  if (rows.length === 0) {
    list.replaceChildren(element("p", "empty-list", emptyMessage()));
    return;
  }

  const top = Math.max(1, rows[0].count);
  const fragment = document.createDocumentFragment();
  let selected = null;
  let focusTarget = null;
  for (const b of rows) {
    const item = element("button", `item grp-${groupOf(b.layer, b.category)}`);
    item.tabIndex = -1; // the list is one Tab stop; typing selects bindings
    item.dataset.layer = b.layer;
    item.dataset.key = b.key;
    if (b.count === 0) item.classList.add("unused");
    if (inLayer && b.key === state.selected) { item.classList.add("selected"); selected = item; }
    if (focusedId === `${b.layer} ${b.key}`) focusTarget = item;

    const chips = element("span", "chips");
    if (!inLayer) {
      const layerChip = chip(b.layer);
      layerChip.classList.add("layer");
      chips.append(layerChip);
    }
    chips.append(chip(b.key));

    const bar = element("span", "bar");
    const fill = element("span", "bar-fill");
    fill.style.width = `${(b.count / top) * 100}%`;
    bar.append(fill);

    const label = element("span", "item-label", b.label);
    if (b.historical) {
      label.append(element("span", "note", " · no longer bound"));
    }
    item.append(iconFor(b), label, chips, bar, element("span", "item-count", b.count ? b.count.toLocaleString("en-US") : "–"));
    fragment.append(item);
  }
  list.replaceChildren(fragment);
  list.scrollTop = scrollTop;
  // Scroll to the selection only when it changed, not on every data update.
  if (state.selected !== listSelected) selected?.scrollIntoView({ block: "nearest" });
  listSelected = state.selected;
  focusTarget?.focus({ preventScroll: true });
}

function renderDetail() {
  const detail = $("detail");
  detail.replaceChildren();
  const layerName = LAYER_NAMES[state.layer] || state.layer;

  if (state.selected === null) {
    detail.className = "detail empty";
    detail.append(element("p", "detail-value", "Press a key to see its details"));
    return;
  }

  detail.className = "detail";
  const binding = view.scoped.find((b) => b.key === state.selected);
  const text = element("div", "detail-text");

  if (!binding) {
    text.append(
      element("div", "detail-title", `${symbol(state.selected)} · not bound`),
      element("div", "detail-value", `Nothing on Hyper ${symbol(state.layer)} ${symbol(state.selected)} yet`),
    );
  } else if (binding.historical) {
    const last = store.lastUsedOf(`${binding.layer} ${binding.key}`);
    text.append(
      element("div", "detail-title", `${binding.label} · no longer bound`),
      element("div", "detail-value", [plural(binding.count, "press"), last ? `last ${timeAgo(last)}` : null].filter(Boolean).join(" · ")),
    );
  } else {
    const facts = [];
    if (binding.count > 0) {
      facts.push(plural(binding.count, "press"));
      facts.push(`#${view.used.indexOf(binding) + 1} in ${layerName}`);
    } else {
      facts.push(`Not used in ${monthLabel(view.month)}`);
    }
    const last = store.lastUsedOf(`${binding.layer} ${binding.key}`);
    facts.push(last ? `last ${timeAgo(last)}` : "never used");
    text.append(
      element("div", "detail-title", `${symbol(binding.key)} · ${binding.label}${binding.category ? ` · ${CATEGORY_LABELS[binding.category]}` : ""}`),
      element("div", "detail-value", facts.join(" · ")),
    );
  }

  detail.append(chip(state.selected), text);
}

function comboChip([layer, key]) {
  const node = element("span", "chip combo");
  const first = element("i", "", layer.toUpperCase());
  const second = element("b", "", symbol(key));
  node.append(first, second);
  return node;
}

function insightsEmptyMessage() {
  const status = health?.insights;
  if (status?.status === "running") return "Analysis is running — insights appear when it finishes.";
  if (status?.status === "missing-tool") return "The analysis tool was not found, so there are no insights.";
  if (status?.status === "failed") return `Analysis failed${status.message ? `: ${status.message}` : "."}`;
  return "No insights yet — they appear after the first analysis runs.";
}

function renderInsights() {
  const root = $("insights");
  root.replaceChildren();

  if (!insightsData) {
    root.append(element("p", "empty-list", insightsEmptyMessage()));
    return;
  }
  if (insightsData.insights.length === 0) {
    root.append(element("p", "empty-list", "Nothing stands out this month."));
    return;
  }

  const list = element("div", "insight-list");
  for (const item of insightsData.insights) {
    const tone = INSIGHT_KINDS[item.kind] || INSIGHT_KINDS.peak;
    const keys = item.keys;

    const marker = element("span", "marker");
    marker.style.setProperty("--tone", tone.color);
    marker.style.setProperty("--tone-bg", tone.background);
    marker.innerHTML = tone.icon;
    marker.setAttribute("role", "img");
    marker.setAttribute("aria-label", item.kind);

    const text = element("div", "insight-text");
    text.append(element("div", "insight-title", item.title), element("div", "insight-detail", item.detail));
    // Version 3 findings name the days they rest on and, when one applies, the app.
    const meta = [...item.dates.map((date) => HyperdashModel.dayLabel(date, today())), ...(item.app ? [appName(item.app)] : [])];
    if (meta.length) text.append(element("div", "insight-meta", meta.join(" · ").toUpperCase()));

    const clickable = keys.length > 0 || item.dates.length > 0;
    const card = element(clickable ? "button" : "div", "insight");
    card.append(marker, text);
    if (keys.length) {
      const chips = element("div", "chips");
      // Two combos fit beside the text; more collapse to the first plus a count.
      const shown = keys.length > 2 ? 1 : keys.length;
      chips.append(...keys.slice(0, shown).map(comboChip));
      if (keys.length > shown) chips.append(element("span", "chip", `+${keys.length - shown}`));
      card.append(chips);
      // The card describes the report's month, so open the combo in that month.
      card.addEventListener("click", () => openCombo(keys[0][0], keys[0][1], insightsData.month));
    } else if (item.dates.length) {
      // No command to open: show the first supporting day in Activity.
      card.addEventListener("click", () => openDay(item.dates[0], item.app));
    }
    card.dataset.key = `${item.kind} ${item.title}`; // its identity when a render rebuilds it
    list.append(card);
  }
  root.append(list);
}

// Activity ------------------------------------------------------------------------------------------
// Day view: one date, half-hour dots, a strip under the axis for app-context coverage (recorded, locked,
// asleep, none), an interval listing its commands, and recurring pairs. Month view: all days of the month combined, as before.

const contextOn = () => {
  const status = health?.context?.status;
  return status === "ok" || (status === undefined && context.summary().count > 0);
};

function today() {
  return HyperdashModel.dateOf(currentNow());
}

function appName(bundle) {
  return appNames[bundle] || bundle.split(".").pop();
}

function firstDay() {
  const days = store.dayList();
  return days.length ? days[0] : today();
}

function activityModel() {
  const M = HyperdashModel;
  const capacity = Math.floor(CHART.plot / CHART.step);
  if (state.activityMode === "day") {
    const day = M.buildDay({
      usage: store, context: contextOn() ? context : null, date: state.day, now: currentNow(),
      appFilter: contextOn() ? state.appFilter : null, highlight: state.highlight, classify, capacity,
    });
    return { mode: "day", day, a: day.activity };
  }
  return { mode: "month", day: null, a: M.buildActivityFromCombos(store.binsOf(state.monthId), classify, state.highlight, capacity) };
}

function dayCaption() {
  const M = HyperdashModel;
  if (state.activityMode === "month") return "ALL DAYS COMBINED";
  if (state.day === today()) return "UNFINISHED";
  return M.dayLabel(state.day, today()).toUpperCase();
}

function renderControls() {
  const M = HyperdashModel;
  const t = today();
  const yesterday = M.addDays(t, -1);
  const day = state.activityMode === "day";
  const signature = `${state.activityMode}|${state.day}|${t}|${dayCaption()}`;
  if (signature === controlsSignature) return;
  controlsSignature = signature;
  const button = (label, pressed, action) => {
    const node = element("button", "seg", label);
    node.setAttribute("aria-pressed", String(pressed));
    node.dataset.action = action;
    return node;
  };
  $("controls").replaceChildren(
    button("TODAY", day && state.day === t, "today"),
    button("YESTERDAY", day && state.day === yesterday, "yesterday"),
    button("MONTH", !day, "month"),
    element("span", "note", dayCaption()),
  );
}

// One column of dots per half hour. In the day view the plot also shows what the clock was doing.
function renderChart(m) {
  const root = $("chart");
  const a = m.a;
  const day = m.mode === "day";
  const segments = day ? m.day.segments : null;
  // The readout reads these on hover, so they follow every render, rebuilt or not.
  lastActivity = a;
  lastSegments = segments;
  const signature = [m.mode, day ? state.day : view.month, state.highlight, state.interval, a.perDot, a.all.join(","), a.hit.join(","),
    GROUPS.map((group) => a.byGroup[group].join(",")).join(";"),
    a.total === 0 ? emptyMessage() : "", segments ? segments.map((s) => `${s.state}${s.from}-${s.to}`).join(",") : ""].join("|");
  if (signature === chartSignature) return;
  chartSignature = signature;
  const focusedBin = document.activeElement?.classList?.contains("bin") ? document.activeElement.dataset.bin : null;

  const { width, top, plot, step, height } = CHART;
  const binWidth = width / 48;
  const centre = top + plot / 2;
  const highlighting = state.highlight !== null;
  const paths = { grey: "", lit: "" };
  for (const group of GROUPS) paths[`g-${group}`] = "";
  const busiest = a.total === 0 ? -1 : a.all.indexOf(Math.max(...a.all));
  let bins = "";

  for (let bin = 0; bin < 48; bin++) {
    const count = a.all[bin];
    if (!count) continue;
    const x = ((bin + 0.5) * binWidth).toFixed(1);
    const dots = Math.ceil(count / a.perDot);
    const at = (j) => `M${x} ${(centre + (j - (dots - 1) / 2) * step).toFixed(1)}h0`;

    if (highlighting) {
      // The highlighted layer sits at the bottom of the column in the selection colour.
      const lit = a.hit[bin] ? Math.min(dots, Math.max(1, Math.round(a.hit[bin] / a.perDot))) : 0;
      for (let j = 0; j < dots; j++) paths[j >= dots - lit ? "lit" : "grey"] += at(j);
    } else {
      // Dots split across groups in proportion to their presses, stacked in legend order.
      let used = 0;
      let seen = 0;
      for (const group of GROUPS) {
        seen += a.byGroup[group][bin];
        const upTo = Math.round((seen / count) * dots);
        for (let j = used; j < upTo; j++) paths[`g-${group}`] += at(j);
        used = upTo;
      }
    }
    const description = HyperdashModel.describeBin(a, bin);
    bins += `<rect class="bin${day && state.interval === bin ? " selected" : ""}" data-bin="${bin}" tabindex="${bin === busiest ? 0 : -1}" role="img" aria-label="${description}" x="${(bin * binWidth).toFixed(1)}" y="${top}" width="${binWidth.toFixed(1)}" height="${plot}"></rect>`;
  }

  const base = top + plot + 6;
  // A 1 px SVG line is not snapped like a CSS border: centre it so both edges fall on whole device pixels.
  const crisp = (v) => (Math.round(v * devicePixelRatio - devicePixelRatio / 2) + devicePixelRatio / 2) / devicePixelRatio;
  const peakX = crisp((a.peakHour + 0.5) * (width / 24));
  const peakAnchor = peakX < 36 ? "start" : peakX > width - 36 ? "end" : "middle";
  const axis = [0, 6, 12, 18, 24].map((hour) => {
    const anchor = hour === 0 ? "start" : hour === 24 ? "end" : "middle";
    return `<text x="${hour * (width / 24)}" y="${height - 3}" text-anchor="${anchor}">${hour}H</text>`;
  }).join("");

  const grid = [0, 6, 12, 18, 24].map((hour) => {
    const x = crisp(hour * (width / 24));
    return `<line class="grid-line" x1="${x}" x2="${x}" y1="${top}" y2="${base}"/>`;
  }).join("");
  const stripTop = base + 3;
  let strip = "";
  let now = "";
  let nowX = null;
  if (day) {
    const spans = segments || [{ from: 0, to: 86400, state: "off" }];
    for (const segment of spans) {
      const x = (segment.from / 86400 * width).toFixed(1);
      const w = ((segment.to - segment.from) / 86400 * width).toFixed(1);
      const kind = segment.state === "unknown" ? "none" : segment.state;
      strip += `<rect class="cov-${kind}" x="${x}" y="${stripTop}" width="${w}" height="${CHART.strip}"/>`;
    }
    if (state.day === today()) {
      nowX = crisp((HyperdashModel.absSeconds(currentNow()) - HyperdashModel.absSeconds(`${state.day}T00:00:00`)) / 86400 * width);
    }
  }

  // PEAK and NOW share the top row. When they would touch, NOW moves to the row below and away from the peak line.
  let peakRow = 9;
  let nowRow = 9;
  let nowAnchor = nowX !== null && nowX > width - 24 ? "end" : "middle";
  if (nowX !== null && a.total !== 0 && Math.abs(nowX - peakX) < 52) {
    nowRow = 17;
    nowAnchor = nowX >= peakX ? "start" : "end";
  }
  if (nowX !== null) {
    const at = nowX.toFixed(1);
    const labelX = (nowAnchor === "start" ? nowX + 3 : nowAnchor === "end" ? nowX - 3 : nowX).toFixed(1);
    now = `<line class="now-line" x1="${at}" x2="${at}" y1="${top - 4}" y2="${base}"/>`
      + `<text class="now-label" x="${labelX}" y="${nowRow}" text-anchor="${nowAnchor}">NOW</text>`;
  }

  const peak = a.total === 0 ? "" : `<line class="peak-line" x1="${peakX}" x2="${peakX}" y1="${top - 4}" y2="${base}"/>`
    + `<text class="peak-label" x="${peakX}" y="${peakRow}" text-anchor="${peakAnchor}">PEAK ${a.peakHour}H</text>`;
  root.innerHTML = `<svg class="chart" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="group" aria-label="Presses by half hour of day">`
    + `<defs><pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="4"/></pattern></defs>`
    + `${grid}<line class="baseline" x1="0" x2="${width}" y1="${crisp(base)}" y2="${crisp(base)}"/>${strip}${now}${peak}`
    + Object.entries(paths).map(([name, d]) => `<path class="dots ${name}" d="${d}"/>`).join("")
    + `${bins}${axis}</svg>`;
  const readout = element("div", "bin-readout");
  readout.append(element("span", "r1"), element("span", "r2"));
  root.append(readout);
  setReadout(readout, null);

  const legend = element("div", "chart-legend");
  const swatch = (color, label, n, className = "") => {
    const item = element("span", "", n === null ? label : `${label} ${HyperdashModel.compactCount(n)}`);
    if (n !== null) item.setAttribute("aria-label", `${label.toLowerCase()} ${n.toLocaleString("en-US")}`);
    const dot = element("i", `swatch ${className}`);
    if (color) dot.style.background = color;
    item.prepend(dot);
    return item;
  };
  // Six group cells (two rows) then the shading and scale row: the same size on every day.
  if (highlighting) {
    legend.append(
      swatch("var(--accent-soft)", (LAYER_NAMES[state.highlight] || state.highlight).toUpperCase(), a.hitTotal),
      swatch("var(--dim)", "OTHER", a.total - a.hitTotal),
    );
    for (let i = 0; i < 4; i++) legend.append(element("span"));
  } else {
    for (const group of GROUPS) {
      const cell = swatch(`var(--g-${group})`, GROUP_LABELS[group].toUpperCase(), a.groupTotals[group]);
      if (a.groupTotals[group] === 0) cell.classList.add("zero");
      legend.append(cell);
    }
  }
  // Third row: the strip key. Month view keeps the row, empty. The dot scale lives in the idle readout.
  const key = element("div", "row");
  if (day) {
    const kinds = new Set((segments || []).map((s) => (s.state === "unknown" ? "none" : s.state)));
    if (segments) {
      key.append(swatch(null, "RECORDED", null, "cov-recorded"));
      if (kinds.has("locked")) key.append(swatch(null, "LOCKED", null, "cov-locked"));
      if (kinds.has("asleep")) key.append(swatch(null, "ASLEEP", null, "cov-asleep"));
      if (kinds.has("none")) key.append(swatch(null, "NO APP CONTEXT", null, "cov-none"));
    } else key.append(element("span", "zero", "APP CONTEXT OFF"));
  }
  legend.append(key);
  root.append(legend);

  const refocus = focusedBin === null ? null : root.querySelector(`.bin[data-bin="${focusedBin}"]`);
  if (refocus) {
    root.querySelector('.bin[tabindex="0"]')?.setAttribute("tabindex", "-1");
    refocus.tabIndex = 0;
    refocus.focus({ preventScroll: true });
  }
}

// The readout under the chart is two fixed lines: the time range and total, then a count per colour group in
// legend order (the dots carry the colour; the full wording is in the bin's tooltip and label).
function setReadout(readout, bin) {
  const a = lastActivity;
  const [first, second] = readout.children;
  second.replaceChildren();
  const idle = bin === null || !a || !a.all[bin];
  readout.classList.toggle("idle", idle);
  if (idle) {
    first.textContent = !a || a.total === 0 ? emptyMessage() : a.perDot > 1 ? `${BIN_HINT} · 1 DOT ≈ ${a.perDot}` : BIN_HINT;
    return;
  }
  const n = a.all[bin];
  const coverage = HyperdashModel.coverageNote(lastSegments, bin);
  first.textContent = `${HyperdashModel.binTime(bin)}–${HyperdashModel.binTime(bin + 1)} · ${n.toLocaleString("en-US")} ${n === 1 ? "press" : "presses"}${coverage ? ` · ${coverage}` : ""}`;
  for (const group of GROUPS) {
    const cell = element("span");
    const dot = element("i");
    dot.style.background = `var(--g-${group})`;
    cell.append(dot, document.createTextNode(String(a.byGroup[group][bin] || "–")));
    second.append(cell);
  }
}

function appIcon(bundle) {
  const name = appName(bundle);
  const source = icons.apps[bundle] || icons.apps[name];
  const node = element("span", "icon");
  if (source) {
    const image = element("img");
    image.src = source;
    node.append(image);
    return node;
  }
  node.classList.add("mono");
  node.textContent = name.charAt(0).toUpperCase();
  node.style.background = "var(--hover)";
  node.style.color = "var(--soft)";
  return node;
}

function renderAppbar(m) {
  const root = $("appbar");
  root.style.visibility = m.mode === "day" ? "" : "hidden"; // keeps its row so the page height holds
  if (m.mode !== "day") { root.replaceChildren(); appbarSignature = null; return; }
  const status = health?.context?.status;
  const on = contextOn();
  const signature = `${on}|${status}|${state.appFilter}|${m.day.apps.map((x) => `${x.app}${x.count}`).join(",")}|${iconVersion}|${appNamesVersion}`;
  if (signature === appbarSignature) return;
  appbarSignature = signature;
  if (!on) {
    root.replaceChildren(element("span", "", status === "disabled" || status === undefined ? "App context off" : `App context ${status}`));
    return;
  }
  // The selected app keeps its chip, so the filter stays visible and removable: it takes the third
  // place when it ranks lower, with 0 on a day it has no presses.
  let shown = m.day.apps.slice(0, 3);
  if (state.appFilter !== null && !shown.some(({ app }) => app === state.appFilter)) {
    const selected = m.day.apps.find(({ app }) => app === state.appFilter) || { app: state.appFilter, count: 0 };
    shown = [...shown.slice(0, 2), selected];
  }
  if (shown.length === 0) {
    root.replaceChildren(element("span", "", "No app activity recorded this day"));
    return;
  }
  root.replaceChildren(...shown.map(({ app, count }) => {
    const chip = element("button", "appchip");
    chip.dataset.app = app;
    chip.setAttribute("aria-pressed", String(state.appFilter === app));
    chip.setAttribute("aria-label", `${appName(app)} (${app}), ${count} presses, filter`);
    chip.append(appIcon(app), element("span", "", appName(app)), element("b", "", String(count)));
    return chip;
  }));
}

function commandRow(event, focusSec) {
  const row = element("div", `cmd grp-${classify.groupOf(event.combo)}${event.sec === focusSec ? " focus" : ""}`);
  const category = classify.categoryOf(event.combo);
  const glyphNode = element("span", "icon");
  glyphNode.innerHTML = CATEGORY_GLYPHS[category] || LAYER_GLYPHS[event.layer] || lineIcon('<circle cx="12" cy="12" r="3"/>');
  const label = labelByCombo[event.combo] || `${event.layer.toUpperCase()} ${event.key.length === 1 ? event.key.toUpperCase() : event.key}`;
  row.append(element("time", "", HyperdashModel.clock(event.sec)), glyphNode, element("span", "cmd-label", label));
  row.append(element("span", "cmd-app", event.app ? appName(event.app) : ""));
  return row;
}

function comboLabel(combo) {
  const cut = combo.indexOf(" ");
  const key = combo.slice(cut + 1);
  return labelByCombo[combo] || `${combo.slice(0, cut).toUpperCase()} ${key.length === 1 ? key.toUpperCase() : key}`;
}

// Below the chart: the commands of the selected interval, or the recurring sequences of the day.
function renderPanel(m) {
  const root = $("panel");
  const M = HyperdashModel;
  if (m.mode !== "day") {
    const signature = "month";
    if (signature === panelSignature) return;
    panelSignature = signature;
    const head = element("div", "panel-head");
    head.append(element("span", "", "Month view"), element("span", "", "all days combined"));
    const body = element("div", "panel-body fade");
    body.append(element("p", "panel-note", "Pick a day (Enter) for its commands and sequences"));
    root.replaceChildren(head, body, element("p", "panel-note"));
    return;
  }
  const day = m.day;
  const withApp = contextOn();
  const signature = [state.day, state.interval, state.focusSec, state.appFilter, day.events.length, day.events.length ? day.events[day.events.length - 1].sec : "",
    day.sequences.map((s) => `${s.from}>${s.to}${s.count}`).join(","), withApp, context.version(), appNamesVersion, iconVersion].join("|");
  if (signature === panelSignature) return;
  panelSignature = signature;
  const scrollTop = root.querySelector(".cmds")?.scrollTop ?? 0;

  if (state.interval !== null) {
    const bin = state.interval;
    const rows = M.commandsIn(day.events, bin);
    const head = element("div", "panel-head");
    head.append(element("span", "", `${M.binTime(bin)}–${M.binTime(bin + 1)} · ${rows.length} ${rows.length === 1 ? "command" : "commands"}`), element("span", "", "esc · sequences"));
    const list = element("div", "cmds panel-body fade");
    list.append(...rows.map((event) => commandRow(event, state.focusSec)));
    root.replaceChildren(head, list, element("p", "panel-note", withApp ? "App = front app before that second (1 s resolution)" : ""));
    list.scrollTop = scrollTop;
    list.querySelector(".focus")?.scrollIntoView({ block: "nearest" });
    return;
  }

  const head = element("div", "panel-head");
  head.append(element("span", "", "Observed sequences"), element("span", "", "≤ 10 s apart · 3+ times"));
  const list = element("div", "seqs panel-body fade");
  if (day.sequences.length === 0) list.append(element("p", "panel-note", "No pair recurred yet on this day"));
  for (const sequence of day.sequences.slice(0, 4)) {
    const entry = element("div", "seq");
    const title = element("div", "seq-title");
    title.append(element("span", "", `${comboLabel(sequence.from)} → ${comboLabel(sequence.to)}`), element("span", "", `×${sequence.count}`));
    const times = element("div", "seq-times");
    for (const sec of sequence.times.slice(0, 4)) {
      const chip = element("button", "time-chip", M.clock(sec));
      chip.dataset.sec = String(sec);
      if (sec !== sequence.times[0]) chip.tabIndex = -1; // one Tab stop per sequence
      times.append(chip);
    }
    if (sequence.times.length > 4) times.append(element("span", "seq-more", `+${sequence.times.length - 4}`));
    entry.append(title, times);
    list.append(entry);
  }
  root.replaceChildren(head, list, element("p", "panel-note"));
}

function renderActivity(m) {
  renderControls();
  renderChart(m);
  renderAppbar(m);
  renderPanel(m);
}

function renderFooter() {
  const hints = dataError !== null ? [["esc", "close"]]
    : state.page === "insights" ? [["esc", "back"]]
    : state.page === "activity" ? activityHints()
    : state.layer === null
      ? [["key", "open"], ["I", "insights"], ["A", "activity"], ["← →", "month"]]
      : [["key", "select"], ["⇧ ← →", "month"], ["esc", state.selected ? "clear" : "back"]];
  $("footer").replaceChildren(...hints.map(([keys, label]) => {
    const hint = element("span");
    for (const k of keys.split(" ")) hint.append(element("kbd", "", k));
    hint.append(label);
    return hint;
  }));
}

// On Activity a focused bin takes the arrows and Enter, and a keyboard-focused button takes Enter.
function activityHints() {
  const focused = document.activeElement;
  const bin = focused?.classList?.contains("bin") ? Number(focused.dataset.bin) : null;
  const chip = focused?.classList?.contains("time-chip");
  const day = state.activityMode === "day";
  const enter = bin !== null ? (!day ? "day" : state.interval === bin ? "clear" : "select")
    : keyboardFocused(focused) ? "press" : day ? "month" : "day";
  return [["key", "mark"], ["← →", bin !== null ? "bin" : chip ? "time" : day ? "day" : "month"], ["↵", enter], ["esc", state.highlight || state.interval !== null ? "clear" : "back"]];
}

// A key press means "open this layer" on the overview, "select" in a layer.
function pressKey(key) {
  if (state.layer === null) {
    if (view.heat.has(key)) openLayer(key);
  } else {
    select(key);
  }
}

function select(key) {
  state.selected = key;
  render();
}

function openLayer(layer) {
  state.group = null;
  state.layer = layer;
  state.selected = null;
  render();
}

// Back to the overview from a layer or a page.
function closeLayer() {
  Object.assign(state, { layer: null, selected: null, page: null, highlight: null, interval: null, focusSec: null, appFilter: null, group: null });
  render();
}

function openPage(page) {
  state.page = page;
  render();
}

// `month` is set when the combo comes from a report, so the numbers match the card that opened it.
function openCombo(layer, key, month) {
  Object.assign(state, { layer, selected: key, page: null });
  if (month && months.includes(month)) state.monthId = month;
  render();
}

// Activity on one day, optionally filtered to an app (only while app context is on).
function openDay(date, app = null) {
  Object.assign(state, { page: "activity", activityMode: "day", day: HyperdashModel.clampDay(date, firstDay(), today()), interval: null, focusSec: null, appFilter: app && contextOn() ? app : null });
  render();
}

function toggleMode() {
  if (state.activityMode === "day") {
    const month = state.day.slice(0, 7);
    if (months.includes(month)) state.monthId = month;
    Object.assign(state, { activityMode: "month", interval: null, focusSec: null, appFilter: null });
  } else {
    // A browsed month opens on the same day of that month: its last day when shorter, and never outside
    // the recorded days.
    let day = state.day;
    if (day.slice(0, 7) !== state.monthId) {
      const [year, month] = state.monthId.split("-").map(Number);
      const length = new Date(Date.UTC(year, month, 0)).getUTCDate();
      day = `${state.monthId}-${String(Math.min(Number(day.slice(8, 10)), length)).padStart(2, "0")}`;
    }
    Object.assign(state, { activityMode: "day", day: HyperdashModel.clampDay(day, firstDay(), today()) });
  }
  render();
}

function toggleHighlight(layer) {
  if (!layers.includes(layer)) return;
  state.highlight = state.highlight === layer ? null : layer;
  render();
}

function changeDay(step) {
  const next = HyperdashModel.clampDay(HyperdashModel.addDays(state.day, step), firstDay(), today());
  if (next === state.day) return;
  Object.assign(state, { day: next, interval: null, focusSec: null });
  render();
}

function setDay(date, mode = "day") {
  Object.assign(state, { day: date, activityMode: mode, interval: null, focusSec: null });
  render();
}

function selectInterval(bin, sec = null) {
  Object.assign(state, { interval: bin, focusSec: sec });
  render();
}

function changeMonth(step) {
  if (state.page === "activity" && state.activityMode === "day") { changeDay(step); return; }
  const next = months.indexOf(state.monthId) + step;
  if (next < 0 || next >= months.length) return;
  state.monthId = months[next];
  render();
}

// Themes only change colour: the data-theme attribute switches the token set. Nothing re-renders.
function applyTheme(name) {
  theme = HyperdashModel.normalizeTheme(name);
  document.documentElement.dataset.theme = theme;
  const button = $("theme-button");
  if (button) button.textContent = `THEME · ${theme.toUpperCase()}`;
  return theme;
}

// The user switched: apply the next theme and tell the host so it can save the choice.
function cycleTheme() {
  applyTheme(HyperdashModel.nextTheme(theme));
  post({ action: "theme", theme });
}

function toggleAbout(open) {
  state.aboutOpen = open ?? !state.aboutOpen;
  render();
}

// The header buttons, the "i" button and the list are Tab stops only once the user has pressed Tab.
// Edge fades follow the scroll position: set after every render and on every scroll, no animation.
function refreshFade(node) {
  const next = HyperdashModel.fadeState(node);
  if (next === "none") node.removeAttribute("data-fade");
  else if (node.getAttribute("data-fade") !== next) node.setAttribute("data-fade", next);
}

function refreshFades() {
  for (const node of document.querySelectorAll(".fade")) refreshFade(node);
}

function applyTabStops() {
  for (const node of document.querySelectorAll(".tabstop")) node.tabIndex = tabStops ? 0 : -1;
}

// Host protocol: window.hyperdash. The host sends one call at a time and waits for the result.
// Every call except open() keeps the page, month id, selection, highlight, scroll and focus.

// Starts a call: the "now" it supplied, or the real clock.
function begin(data) {
  renderNow = HyperdashModel.stampOrNull(data?.now);
  return currentNow();
}

// Keeps months, layers and navigation consistent after data or bindings change.
function reconcile(now) {
  classify = HyperdashModel.classifier(bindings);
  labelByCombo = {};
  for (const b of bindings) labelByCombo[`${b.layer} ${b.key}`] = b.label;
  months = store.months(now);
  state.day = HyperdashModel.clampDay(state.day || HyperdashModel.dateOf(now), firstDay(), HyperdashModel.dateOf(now));
  if (!contextOn()) state.appFilter = null;
  const known = new Set(bindings.map((b) => b.layer));
  for (const layer of store.layerList()) known.add(layer);
  layers = [...known];
  Object.assign(state, HyperdashModel.reconcileNavigation(state, months, layers));
}

function finish(extra) {
  render(false);
  renderNow = null;
  return { ...extra, height: document.body.scrollHeight };
}

const hyperdash = {
  // Full load for startup and recovery: discards all event state and parses `text` (bytes 0 to `offset`).
  reset(data) {
    const now = begin(data);
    if (data?.stream === "context") {
      const result = contextSession.reset(data, now);
      reconcile(now);
      return finish(result);
    }
    const checked = HyperdashModel.validatePayload({ bindings: data?.bindings, log: data?.text, insights: data?.insights, health: data?.health });
    dataError = checked.ok ? null : checked.error;
    bindings = checked.ok ? checked.bindings : [];
    const result = session.reset(checked.ok ? data : null, now);
    insightsData = checked.ok ? checked.insights : null;
    health = checked.ok ? checked.health : null;
    iconVersion += 1;
    iconCache.clear();
    reconcile(now);
    return finish(result);
  },

  // New complete lines covering bytes [from, to). Applied only for the current generation, in order.
  append(data) {
    const now = begin(data);
    const result = (data?.stream === "context" ? contextSession : session).append(data, now);
    if (!result.ok) { renderNow = null; return result; }
    reconcile(now);
    return finish(result);
  },

  setBindings(list, nextHealth) {
    if (!Array.isArray(list)) return { ok: false, reason: "invalid" };
    const now = begin();
    bindings = HyperdashModel.normalizeBindings(list);
    if (nextHealth !== undefined) health = HyperdashModel.normalizeHealth(nextHealth);
    iconVersion += 1;
    iconCache.clear();
    reconcile(now);
    return finish({ ok: true });
  },

  // The host restores the saved theme. Unlike a user switch this does not post back.
  setTheme(name) {
    begin();
    return { ok: true, theme: applyTheme(name) };
  },

  // Display names for bundle IDs, e.g. { "com.mitchellh.ghostty": "Ghostty" }.
  setApps(map) {
    begin();
    appNames = {};
    if (map && typeof map === "object") for (const [id, name] of Object.entries(map)) if (typeof name === "string") appNames[id] = name;
    appNamesVersion += 1;
    return finish({ ok: true });
  },

  setInsights(insights, nextHealth) {
    begin();
    insightsData = HyperdashModel.normalizeInsights(insights);
    if (nextHealth !== undefined) health = HyperdashModel.normalizeHealth(nextHealth);
    return finish({ ok: true });
  },

  // Status only: never rebuilds list rows. Pieces that quote the status are guarded by their own signatures.
  setHealth(nextHealth) {
    begin();
    health = HyperdashModel.normalizeHealth(nextHealth);
    const refocus = keyboardFocused(document.activeElement) ? rebuiltControl(document.activeElement) : null;
    renderStatus(dataError !== null);
    if (dataError === null && state.page === null) renderList(state.layer !== null);
    else if (dataError === null && state.page === "insights" && !insightsData) renderInsights();
    else if (dataError === null && state.page === "activity") renderActivity(activityModel());
    if (refocus && document.activeElement === document.body) document.querySelector(refocus)?.focus({ preventScroll: true });
    refreshFades();
    renderNow = null;
    return { ok: true, height: document.body.scrollHeight };
  },

  // Each panel open, after any pending reset or append: the only call that resets navigation.
  open(data) {
    const now = begin(data);
    store.tick(now);
    reconcile(now);
    Object.assign(state, {
      layer: null, selected: null, page: null, highlight: null, aboutOpen: false, monthId: months[months.length - 1],
      activityMode: "day", day: HyperdashModel.dateOf(now), interval: null, focusSec: null, appFilter: null, group: null,
    });
    listScope = null;
    listSignature = null;
    controlsSignature = chartSignature = appbarSignature = panelSignature = groupSignature = null;
    // Every open starts with no focused control and no Tab stops, so Space or a letter never activates a
    // stray button and the window becoming key draws no focus ring. The list starts at the top.
    tabStops = false;
    applyTabStops();
    document.activeElement?.blur();
    $("list").scrollTop = 0;
    return finish();
  },

  // Date change, wake and open: promotes future-dated events whose time has come and refreshes the month list.
  tick(data) {
    const now = begin(data);
    store.tick(now);
    reconcile(now);
    return finish({ ok: true });
  },
};
window.hyperdash = hyperdash;

// Called by Hammerspoon after load, and again if icons change. May run before or after the first reset().
function setIcons(data) {
  icons = { apps: data?.apps || {}, sites: data?.sites || {} };
  iconCache.clear();
  iconVersion += 1;
  render();
}

function run(action) {
  switch (action.type) {
    case "close": post({ action: "close" }); break;
    case "closeAbout": toggleAbout(false); break;
    case "toggleAbout": toggleAbout(); break;
    case "cycleTheme": cycleTheme(); break;
    case "back": closeLayer(); break;
    case "month": changeMonth(action.step); break;
    case "select": select(action.key); break;
    case "highlight": toggleHighlight(action.layer); break;
    case "openLayer": openLayer(action.layer); break;
    case "openPage": openPage(action.page); break;
    case "day": changeDay(action.step); break;
    case "today": setDay(today()); break;
    case "toggleMode": toggleMode(); break;
    case "clearInterval": Object.assign(state, { interval: null, focusSec: null }); render(); break;
    default: break;
  }
}

const keyboardFocused = (node) => Boolean(node?.matches?.("button:focus-visible"));

// Activity rebuilds its controls on every change, Insights its cards and About its theme button; the same
// control keeps keyboard focus. A time chip, which gives way to its interval's commands, hands focus to
// the selected bin.
const rebuiltControl = (node) => node.dataset.action ? `.seg[data-action="${node.dataset.action}"]`
  : node.dataset.app ? `.appchip[data-app="${node.dataset.app}"]`
  : node.classList.contains("insight") ? `.insight[data-key="${CSS.escape(node.dataset.key)}"]`
  : node.id === "theme-button" ? "#theme-button"
  : node.classList.contains("time-chip") ? ".bin.selected" : null;

// Bin details: hover and keyboard focus show exact counts with the family split in words.
function showBin(event) {
  const bin = event.target.closest?.(".bin");
  const readout = $("activity").querySelector(".bin-readout");
  if (readout) setReadout(readout, bin ? Number(bin.dataset.bin) : null);
}

$("activity").addEventListener("focusin", showBin);
$("activity").addEventListener("mouseover", showBin);
$("activity").addEventListener("focusout", showBin);
$("activity").addEventListener("mouseout", showBin);
// The Activity hints follow focus.
document.addEventListener("focusin", renderFooter);
document.addEventListener("focusout", renderFooter);
$("activity").addEventListener("keydown", (event) => {
  const bin = event.target.closest?.(".bin");
  if (bin && (event.key === "Enter" || event.key === " ") && state.activityMode === "day") {
    event.preventDefault();
    event.stopPropagation();
    selectInterval(state.interval === Number(bin.dataset.bin) ? null : Number(bin.dataset.bin));
    return;
  }
  // The arrows walk the bins, or the timestamps of one sequence (one Tab stop each).
  const item = bin || event.target.closest?.(".time-chip");
  if (!item || event.shiftKey || (event.key !== "ArrowLeft" && event.key !== "ArrowRight")) return;
  const peers = [...(bin ? $("activity") : item.parentNode).querySelectorAll(bin ? ".bin" : ".time-chip")];
  const next = peers[peers.indexOf(item) + (event.key === "ArrowLeft" ? -1 : 1)];
  event.preventDefault();
  event.stopPropagation();
  if (!next) return;
  item.tabIndex = -1;
  next.tabIndex = 0;
  next.focus();
});

// Activity: day buttons, app chips, interval bins and sequence timestamps.
$("activity").addEventListener("click", (event) => {
  const target = event.target;
  const button = target.closest?.("[data-action]");
  const chip = target.closest?.(".appchip");
  const time = target.closest?.(".time-chip");
  const bin = target.closest?.(".bin");
  if (button) {
    const action = button.dataset.action;
    if (action === "today") setDay(today());
    else if (action === "yesterday") setDay(HyperdashModel.addDays(today(), -1));
    else if (state.activityMode === "day") toggleMode();
  } else if (chip) {
    state.appFilter = state.appFilter === chip.dataset.app ? null : chip.dataset.app;
    state.interval = null;
    state.focusSec = null;
    render();
  } else if (time) {
    const sec = Number(time.dataset.sec);
    selectInterval(Math.floor(sec / 1800), sec);
  } else if (bin && state.activityMode === "day") {
    selectInterval(state.interval === Number(bin.dataset.bin) ? null : Number(bin.dataset.bin));
  }
});

// Hovering or focusing a group segment names it in the caption (no native tooltip, which clips at the card edge).
const showGroup = (event) => {
  const segment = event.target.closest?.("button");
  groupCaptionOverride = segment ? segment.dataset.caption : null;
  groupSignature = null;
  renderGroupbar(!$("groupwrap").hidden);
};
$("groupbar").addEventListener("mouseover", showGroup);
$("groupbar").addEventListener("mouseout", showGroup);
$("groupbar").addEventListener("focusin", showGroup);
$("groupbar").addEventListener("focusout", showGroup);

$("groupbar").addEventListener("click", (event) => {
  const segment = event.target.closest("button");
  if (!segment) return;
  state.group = state.group === segment.dataset.group ? null : segment.dataset.group;
  render();
});

$("list").addEventListener("click", (event) => {
  const item = event.target.closest(".item");
  if (!item) return;
  if (state.layer === null) openCombo(item.dataset.layer, item.dataset.key);
  else select(item.dataset.key);
});
$("close").addEventListener("click", () => post({ action: "close" }));
$("previous-month").addEventListener("click", () => changeMonth(-1));
$("next-month").addEventListener("click", () => changeMonth(1));
$("about-toggle").addEventListener("click", () => toggleAbout());
$("about").addEventListener("click", (event) => { if (event.target.closest(".themebtn")) cycleTheme(); });

// When the window becomes key, WebKit may focus its first control. Drop that focus unless the user is tabbing.
window.addEventListener("focus", () => {
  if (!tabStops && document.activeElement?.closest?.(".header, .info, #list")) document.activeElement.blur();
});

document.addEventListener("keydown", (event) => {
  if (!tabStops && HyperdashModel.tabStopsAfter(tabStops, event)) {
    tabStops = true;
    applyTabStops();
  }
  if (dataError !== null) {
    if (event.key === "Escape") post({ action: "close" });
    return;
  }
  // A button focused from the keyboard keeps its normal Enter and Space activation. A button focused by a
  // mouse click does not, so Space still selects the Space binding.
  const controlFocused = keyboardFocused(event.target);
  const action = HyperdashModel.routeKey({
    controlFocused,
    page: state.page,
    layer: state.layer,
    highlight: state.highlight,
    selected: state.selected,
    aboutOpen: state.aboutOpen,
    activityMode: state.activityMode,
    interval: state.interval,
    layers,
    heatHas: (key) => view.heat.has(key),
  }, event);
  if (!action) return;
  event.preventDefault();
  run(action);
});

// Scroll does not bubble, so listen in the capture phase for every scroll area at once.
document.addEventListener("scroll", (event) => { if (event.target.classList?.contains("fade")) refreshFade(event.target); }, { capture: true, passive: true });

buildKeyboard();
hyperdash.reset({ generation: 0, bindings: [], text: "", offset: 0 });
applyTabStops();
applyTheme("manila");
</script>
</body>
</html>
