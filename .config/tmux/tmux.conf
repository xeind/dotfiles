# Color support
set -sg terminal-overrides ",*:RGB"

# Italics support
set -g default-terminal "${TERM}"
set -ga terminal-overrides ",-256color:Tc"

# Undercurl support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

set-option -g focus-events on
set -sg escape-time 50

set-option -g base-index 1
set-option -g pane-base-index 1
set-option -g history-limit 100000

set-option -g extended-keys on

# Status bar: session | windows ... zoom flag, prefix, date. Nightingale colors.
set -g status-interval 10
set -g status-justify left
set -g status-position bottom
set -g status-left-length 200
set -g status-style 'bg=default'
set -g mode-style "fg=#585858,bg=#C4B28A"
set -g message-style "fg=#585858,bg=#C4B28A"
set -g message-command-style "fg=#585858,bg=#C4B28A"
set -g status-left "#[fg=#7E9CD8,bg=default]  #S #[fg=#54546D,bg=default]|"
set -g status-right "#[fg=#D27E99,bg=default]#{?window_zoomed_flag, ,} #{prefix_highlight} #[fg=#54546D,bg=default]|#[fg=#DCD7BA,bg=default] %m/%d/%y "
set -g window-status-current-format '#[fg=#C8C093,bg=default] #I*#W'
set -g window-status-format '#[fg=#54546D,bg=default] #I #W'

bind -r g display-popup -d '#{pane_current_path}' -w80% -h80% -E lazygit
bind -r F display-popup -d '#{pane_current_path}' -w80% -h80% -E vallow

# fingers defaults to F, taken by the vallow popup above. Set before the
# plugin loads.
set -g @fingers-key y

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-fingers'

run '~/.config/tmux/plugins/tpm/tpm'
